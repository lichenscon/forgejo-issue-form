<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support-Formular</title>
    <!-- Optional: Ein einfaches Styling -->
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 120px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Support-Anfrage einreichen</h2>
    
    <form id="supportForm">
        <div class="form-group">
            <label for="name">Dein Name (freiwillig):</label>
            <input type="text" id="name" name="name" placeholder="Max Mustermann">
        </div>

        <div class="form-group">
            <label for="title">Titel (optional, wird sonst automatisch generiert):</label>
            <input type="text" id="title" name="title" placeholder="Kurzbeschreibung des Anliegens">
        </div>

        <div class="form-group">
            <label for="body">Beschreibung (freiwillig):</label>
            <textarea id="body" name="body" placeholder="Beschreibe dein Problem..."></textarea>
        </div>

        <div class="form-group">
            <label for="attachments">Dateien anhängen (optional):</label>
            <input type="file" id="attachments" name="attachments" multiple>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="includeScreenshot" name="includeScreenshot"> 
                Screenshot von dieser Seite anhängen
            </label>
        </div>

        <button type="submit" id="submitBtn">Absenden</button>
    </form>

    <div id="status"></div>

    <!-- html2canvas für die Screenshot-Funktion einbinden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const STORAGE_KEY = "support_form_saved_name";

        // 1. Namen beim Laden aus dem localStorage vorausfühlen
        document.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem(STORAGE_KEY);
            if (savedName) {
                document.getElementById("name").value = savedName;
            }
        });

        // 2. Formular-Absenden abfangen
        document.getElementById("supportForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById("submitBtn");
            const statusDiv = document.getElementById("status");
            submitBtn.disabled = true;
            statusDiv.textContent = "Wird gesendet...";

            // Namen im Browser speichern
            const nameValue = document.getElementById("name").value.trim();
            if (nameValue) {
                localStorage.setItem(STORAGE_KEY, nameValue);
            }

            const formData = new FormData(this);

            // Screenshot erstellen, falls Checkbox aktiviert ist
            const includeScreenshot = document.getElementById("includeScreenshot").checked;
            if (includeScreenshot) {
                try {
                    statusDiv.textContent = "Erstelle Screenshot...";
                    const canvas = await html2canvas(document.body, { ignoreElements: (element) => element.id === 'status' });
                    const base64Screenshot = canvas.toDataURL("image/png");
                    formData.append("screenshot_base64", base64Screenshot);
                } catch (err) {
                    console.error("Fehler beim Erstellen des Screenshots:", err);
                }
            }

            statusDiv.textContent = "Übertrage an Forgejo...";

            try {
                const response = await requestSubmit(formData);
                if (response.ok) {
                    statusDiv.style.color = "green";
                    statusDiv.textContent = "Erfolgreich eingereicht! Vielen Dank.";
                    document.getElementById("supportForm").reset();
                    // Namen nach Reset wiederherstellen, falls gewünscht, oder leer lassen. Hier behalten wir ihn im Feld.
                    if (nameValue) document.getElementById("name").value = nameValue;
                } else {
                    const result = await response.json();
                    statusDiv.style.color = "red";
                    statusDiv.textContent = "Fehler: " + (result.error || "Unbekannter Fehler");
                }
            } catch (error) {
                statusDiv.style.color = "red";
                statusDiv.textContent = "Netzwerkfehler beim Senden.";
                console.error(error);
            } finally {
                submitBtn.disabled = false;
            }
        });

        async function requestSubmit(formData) {
            return await fetch("/submit", {
                method: "POST",
                body: formData
            });
        }
    </script>
</body>
</html>
