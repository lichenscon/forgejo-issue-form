<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgejo Issue Ersteller</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f4f9; color: #333; }
        form { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #2563eb; color: white; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; width: 100%; }
        button:hover { background: #1d4ed8; }
        .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 4px; margin-bottom: 16px; border: 1px solid #a3e635; }
    </style>
</head>
<body>
    <form action="/submit" method="POST">
        <h1>Neues Forgejo Issue melden</h1>
        
        {% if success %}
            <div class="success"><strong>Erfolg!</strong> Das Issue wurde erfolgreich im Repository angelegt.</div>
        {% endif %}

        <label for="title">Titel des Issues:</label>
        <input type="text" id="title" name="title" placeholder="Kurze Zusammenfassung..." required>
        
        <label for="body">Beschreibung:</label>
        <textarea id="body" name="body" rows="6" placeholder="Detaillierte Beschreibung..."></textarea>
        
        <button type="submit">Issue abschicken</button>
    </form>
</body>
</html>
